<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10171b"><title>독자의 기록 · 시나리오 RPG</title>
<link rel="stylesheet" href="game/game.css"><link rel="stylesheet" href="animation/motion.css">
<header class="topbar"><a class="brand" href="index.html"><span class="brand-symbol">讀</span><span>독자의 기록<small>THE READER'S RECORD</small></span></a><nav><a href="reader.html">스토리 서재 ↗</a><button id="help-button" class="quiet">플레이 방법</button><button id="settings-button" class="icon-button" aria-label="게임 설정">⚙</button></nav></header>
<main class="game-layout">
<aside class="journey"><div class="rail-title"><span class="eyebrow">YOUR JOURNEY</span><span id="journey-count">0 / 153</span></div><h2>아직 끝나지 않은 이야기</h2><progress id="journey-progress" max="153" value="0"></progress><nav id="chapter-map" aria-label="시나리오 여정"></nav><div class="rail-bottom"><span class="live-dot"></span><span id="save-status" role="status">이 브라우저에 자동 저장</span></div></aside>
<section class="play-area">
<div class="chapter-line"><span id="chapter-number" class="eyebrow">CHAPTER 01</span><span id="chapter-name">가치 증명</span><span id="game-level">LV. 01</span></div>
<div class="scene-title-row"><div><h1 id="scene-title">이야기를 불러오는 중</h1><p id="scene-goal">한 사람의 독자로부터 시작되는 세계.</p></div><div class="wallet"><span>✦</span><strong id="coins">80</strong><small>COINS</small></div></div>
<div id="battlefield" class="battlefield" data-world="subway" aria-label="게임 전장"><div class="world-art" aria-hidden="true"></div><div class="world-shade" aria-hidden="true"></div><div class="field-top"><span id="location" class="location-chip"></span><span id="phase-label" class="phase-chip">STORY</span></div><div id="units" class="units"></div><div id="floaters" aria-hidden="true"></div><div id="battle-caption" class="battle-caption"></div><div id="field-notice" class="field-notice" role="status" hidden></div></div>
<section id="story-panel" class="story-panel"><div class="speaker-row"><strong id="speaker"></strong><button id="replay-motion" class="quiet" hidden>연출 다시 보기</button><span id="line-count"></span></div><p id="line-text" aria-live="polite"></p><div id="choice-list" class="choice-list"></div><div class="story-actions"><button id="read-scene" class="quiet">이 장면 전체 읽기</button><button id="next-line" class="primary">다음 문장 <span>→</span></button></div></section>
<section id="combat-panel" class="combat-panel" hidden><div class="combat-heading"><span id="turn-label" class="eyebrow">YOUR TURN</span><span id="target-label">적을 눌러 대상을 선택하세요</span><button id="auto-battle" class="quiet" aria-pressed="false">자동 전투 꺼짐</button></div><div id="party-cards" class="party-cards"></div><div class="combat-actions"><button id="attack-button"><span class="action-key">1</span><strong>공격</strong><small>선택한 적에게 기본 공격</small></button><button id="skill-button"><span class="action-key">2</span><strong id="skill-name">능력 발동</strong><small id="skill-cost"></small></button><button id="guard-button"><span class="action-key">3</span><strong>방어</strong><small>받는 피해 감소 · 마력 +5</small></button><button id="item-button"><span class="action-key">4</span><strong>소모품</strong><small>물약 · 능력치 앰플</small></button></div><div id="combat-log" class="combat-log" role="log" aria-live="polite"></div></section>
<section id="result-panel" class="result-panel" hidden></section>
<div class="bottom-bar"><div class="bottom-tabs"><button id="inventory-button"><span>▧</span>가방·장비</button><button id="shop-button"><span>✧</span>도깨비 상점</button><button id="journal-button"><span>☷</span>이야기 기록</button></div><span id="stage-id">ST001</span></div>
<footer><span>프롤로그에서 마계의 봄까지</span><a href="art-preview.html">아트 도감 ↗</a><a href="animations.html">애니메이션 도감 ↗</a></footer>
</section></main>
<dialog id="modal"><div class="modal-top"><div><span id="modal-eyebrow" class="eyebrow">THE READER'S RECORD</span><h2 id="modal-title"></h2></div><button id="modal-close" class="icon-button" aria-label="창 닫기">×</button></div><div id="modal-content"></div></dialog>
<div id="toast" class="toast" role="status" hidden></div>
<script type="module" src="game/app.js"></script></html>
