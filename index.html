<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17150f"><title>독자의 기록 · 시나리오 RPG</title>
<link rel="stylesheet" href="game/game.css?v=major-events-1"><link rel="stylesheet" href="animation/motion.css">
<body><div class="arcade-shell" id="arcade-shell" data-phase="story">
<svg class="icon-definitions" aria-hidden="true"><defs>
<symbol id="i-home" viewBox="0 0 24 24"><path d="M2 11 12 2l10 9h-3v11h-5v-7h-4v7H5V11Z"/></symbol>
<symbol id="i-pause" viewBox="0 0 24 24"><path d="M4 3h6v18H4Zm10 0h6v18h-6Z"/></symbol>
<symbol id="i-bag" viewBox="0 0 24 24"><path d="M7 3h10l-2 5 6 5-2 10H5L3 13l6-5Z"/><path d="M7 9h10M8 16h8" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
<symbol id="i-sword" viewBox="0 0 24 24"><path d="m20 1 2 2-9 13-5-5Z"/><path d="m5 10 9 9-3 2-3-4-5 6-2-2 6-5-4-3Z"/></symbol>
<symbol id="i-shield" viewBox="0 0 24 24"><path d="m12 1 10 4-2 12-8 6-8-6L2 5Zm0 4v13l5-4 1-7Z"/></symbol>
<symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 22 2 12C-5 2 7-3 12 5 17-3 29 2 22 12Z"/></symbol>
<symbol id="i-potion" viewBox="0 0 24 24"><path d="M8 1h8v4h-1v6c10 8 6 12-3 12S-1 19 9 11V5H8Zm3 4v8l-5 5h12l-5-5V5Z"/></symbol>
<symbol id="i-map" viewBox="0 0 24 24"><path d="m1 4 7-3 8 3 7-3v19l-7 3-8-3-7 3Zm8 1v11l6 3V8Z"/></symbol>
<symbol id="i-star" viewBox="0 0 24 24"><path d="m12 1 3 7 8 1-6 6 2 8-7-4-7 4 2-8-6-6 8-1Z"/></symbol>
</defs></svg>
<main class="game-layout">
<section class="arena">
<header class="topbar"><button id="home-button" class="gem-button icon-button" aria-label="타이틀 화면"><svg><use href="#i-home"/></svg></button><div class="stage-plaque"><div class="chapter-line"><span id="chapter-number">시나리오 01</span><span id="chapter-name">가치 증명</span></div><h1 id="scene-title">이야기를 불러오는 중</h1><p id="scene-goal"></p></div><div class="top-actions"><button id="map-button" class="gem-button icon-button" aria-label="시나리오 지도"><svg><use href="#i-map"/></svg></button><button id="help-button" class="gem-button icon-button" aria-label="플레이 방법">?</button><button id="settings-button" class="gem-button icon-button" aria-label="게임 설정">⚙</button><button id="sound-button" class="gem-button icon-button" aria-label="효과음 켜기" aria-pressed="false">♫</button></div></header>
<div id="battlefield" class="battlefield" data-world="subway" aria-label="게임 전장"><div class="world-art" aria-hidden="true"></div><div class="world-shade" aria-hidden="true"></div><div id="battle-hud" class="battle-hud" hidden><div class="battle-health hero-health"><strong id="hud-hero-name"></strong><div><svg><use href="#i-heart"/></svg><span class="health-track"><i id="hud-hero-bar"></i><b id="hud-hero-health"></b></span></div></div><div class="battle-health target-health"><strong id="hud-target-name"></strong><div><span class="health-track"><i id="hud-target-bar"></i><b id="hud-target-health"></b></span><svg><use href="#i-heart"/></svg></div></div></div><div class="field-top"><span id="location" class="location-chip"></span><span id="phase-label" class="phase-chip">STORY</span></div><div id="units" class="units"></div><div id="floaters" aria-hidden="true"></div><div id="battle-caption" class="battle-caption"></div><div id="field-notice" class="field-notice" role="status" hidden></div><section id="result-panel" class="result-panel" hidden></section></div>
<button id="arena-map-button" class="gem-button field-map-button"><svg><use href="#i-map"/></svg><span>지도</span></button>
</section>
<section class="inventory-dock" aria-label="캐릭터와 인벤토리">
<section class="equipment-panel bevel-panel"><div class="level-strip"><strong id="game-level">LV. 1</strong><div class="xp-track"><i id="xp-fill"></i><span id="xp-label">0 / 120</span></div></div><div id="party-cards" class="party-cards"></div><div class="character-stats"><span class="stat health"><svg><use href="#i-heart"/></svg><b id="hud-hp">135</b></span><span class="stat attack"><b id="hud-attack">24</b><svg><use href="#i-sword"/></svg></span><span class="stat defense"><svg><use href="#i-shield"/></svg><b id="hud-defense">5</b></span><span class="stat mana"><b id="hud-mp">24</b><svg><use href="#i-star"/></svg></span></div><div class="paperdoll"><div id="equip-avatar" class="equip-avatar"></div><button id="slot-armor" class="gear-slot armor-slot" data-slot="armor" aria-label="방어구 장착 칸"><svg><use href="#i-shield"/></svg></button><button id="slot-weapon" class="gear-slot weapon-slot" data-slot="weapon" aria-label="무기 장착 칸"><svg><use href="#i-sword"/></svg></button><button id="slot-charm" class="gear-slot charm-slot" data-slot="charm" aria-label="보조 장비 칸"><svg><use href="#i-star"/></svg></button><button id="quick-potion" class="gear-slot potion-slot" aria-label="체력 회복 물약 사용"><svg><use href="#i-potion"/></svg><small id="quick-potion-count">3</small></button></div><div class="paperdoll-name" id="hud-name">김독자</div></section>
<section class="bag-panel bevel-panel" aria-label="가방"><div class="bag-toolbar"><button id="inventory-button" class="bag-tab" aria-label="가방과 장비 상세"><svg><use href="#i-bag"/></svg></button><div class="bag-filters"><button data-bag-filter="all" class="bag-tab" aria-pressed="true" aria-label="모든 아이템">▤</button><button data-bag-filter="gear" class="bag-tab" aria-pressed="false" aria-label="장비만 보기"><svg><use href="#i-sword"/></svg></button><button data-bag-filter="items" class="bag-tab" aria-pressed="false" aria-label="소모품만 보기"><svg><use href="#i-potion"/></svg></button></div><button id="shop-button" class="bag-tab" aria-label="도깨비 상점">✦</button></div><div id="bag-grid" class="bag-grid"></div><div class="bag-bottom"><button id="bag-prev" aria-label="이전 가방 페이지">◀</button><span id="bag-page">1 / 1</span><button id="bag-next" aria-label="다음 가방 페이지">▶</button><div class="wallet"><span>●</span><strong id="coins">80</strong></div></div></section>
<section class="npc-panel bevel-panel"><div class="npc-portrait"><div class="portrait-world"></div><div id="npc-art"></div><span id="npc-name">비형</span></div><section id="story-panel" class="story-panel"><div class="speaker-row"><strong id="speaker"></strong><button id="replay-motion" class="quiet" hidden aria-label="연출 다시 보기">↻</button><span id="line-count"></span></div><div class="dialogue-scroll"><p id="line-text" aria-live="polite"></p><div id="choice-list" class="choice-list"></div></div><div class="story-actions"><button id="read-scene" class="quiet">사건 요약</button><button id="next-line" class="gem-button primary" aria-label="다음 문장">▶</button></div></section><section id="combat-panel" class="combat-panel" hidden><div class="combat-heading"><span id="turn-label">YOUR TURN</span><button id="auto-battle" class="quiet" aria-pressed="false">자동 전투 꺼짐</button></div><span id="target-label"></span><div class="combat-actions"><button id="attack-button" class="gem-button"><span class="action-key">1</span><svg><use href="#i-sword"/></svg><strong>공격</strong><small>기본 공격</small></button><button id="skill-button" class="gem-button"><span class="action-key">2</span><svg><use href="#i-star"/></svg><strong id="skill-name">능력</strong><small id="skill-cost"></small></button><button id="guard-button" class="gem-button"><span class="action-key">3</span><svg><use href="#i-shield"/></svg><strong>방어</strong><small>피해 감소</small></button><button id="item-button" class="gem-button"><span class="action-key">4</span><svg><use href="#i-potion"/></svg><strong>물약</strong><small>소모품 사용</small></button></div><div id="combat-log" class="combat-log" role="log" aria-live="polite"></div></section><p id="npc-idle-note" class="npc-idle-note" hidden>함께 얻은 이야기는 사라지지 않습니다.<br>보상을 받고 다음 시나리오로 향하세요.</p><section id="item-inspector" class="item-inspector" hidden><button id="inspect-close" class="inspect-close" aria-label="아이템 설명 닫기">×</button><div id="inspect-art"></div><h3 id="inspect-name"></h3><p id="inspect-description"></p><p id="inspect-count"></p><div id="inspect-actions"></div></section></section>
</section>
<footer class="game-footer"><span id="stage-id">ST001</span><span id="save-status" role="status">자동 저장</span><button id="journal-button" class="quiet">이야기 기록</button><a href="reader.html">서재</a><a href="art-preview.html">도감</a><a href="animations.html">애니메이션</a></footer>
</main></div>
<dialog id="title-screen" class="title-screen"><div class="title-scene"><div class="title-shade"></div><div class="title-wordmark"><small>OMNISCIENT READER</small><h1>전지적 독자 시점</h1><p>독자의 기록</p></div><div id="title-hero" class="title-hero"></div><div id="title-enemy-left" class="title-enemy title-enemy-left"></div><div id="title-enemy-right" class="title-enemy title-enemy-right"></div><div class="title-buttons"><button id="start-game" class="gem-button">새 게임</button><button id="title-new-game" class="gem-button secondary" disabled>이어하기</button></div><button id="title-sound" class="gem-button icon-button" aria-label="효과음 켜기" aria-pressed="false">♫</button><p class="title-scope">프롤로그 — 마계의 봄</p></div></dialog>
<dialog id="world-map" class="world-map"><div class="map-paper"><header class="map-header"><button id="map-close" class="gem-button icon-button" aria-label="지도 닫기"><svg><use href="#i-home"/></svg></button><h2>시나리오 지도</h2><span id="journey-count">0 / 32</span></header><div class="map-landscape" aria-hidden="true"><span class="map-mountain m1"></span><span class="map-mountain m2"></span><span class="map-mountain m3"></span><span class="map-river"></span><svg viewBox="0 0 1000 430" preserveAspectRatio="none"><path d="M90 75H900Q960 75 960 155T900 225H100Q40 225 40 305T100 365H900"/></svg></div><nav id="chapter-map" aria-label="시나리오 여정"></nav><footer class="map-legend"><span>◆ 현재 시나리오</span><span>● 완료 · 다시 읽기</span><span>▣ 잠김</span><progress id="journey-progress" max="32" value="0"></progress></footer></div></dialog>
<dialog id="modal"><div class="modal-top"><div><span id="modal-eyebrow">THE READER'S RECORD</span><h2 id="modal-title"></h2></div><button id="modal-close" class="gem-button icon-button" aria-label="창 닫기">×</button></div><div id="modal-content"></div></dialog>
<div id="toast" class="toast" role="status" hidden></div>
<script type="module" src="game/app.js?v=major-events-1"></script></body></html>
