<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10171c">
<title>독자의 기록 · 애니메이션 도감</title><link rel="stylesheet" href="animation/preview.css"><link rel="stylesheet" href="animation/motion.css">
<header><a href="index.html" class="brand"><span class="brand-mark">讀</span><span><strong>독자의 기록</strong><small>MOTION & EFFECTS</small></span></a><nav><a href="index.html">스토리로 돌아가기 ↗</a><a href="art-preview.html">아트 도감</a><a href="animation/previews/walking.webm">걷기 영상 ↗</a></nav></header>
<main class="workspace">
 <aside class="collection" aria-label="애니메이션 대상 선택"><div class="section-label"><span>애니메이션 도감</span><span id="entity-count">불러오는 중</span></div><input id="entity-search" class="search" type="search" aria-label="캐릭터·아이템 검색" placeholder="이름으로 찾기"><div class="tabs" id="kind-tabs"></div><div id="entity-list" class="entity-list"></div></aside>
 <section class="studio" aria-label="애니메이션 미리보기"><div class="scene-header"><div><span class="eyebrow">움직이는 이야기</span><h1 id="entity-title">연출을 불러오고 있습니다</h1></div><span class="pill" id="source-status"></span></div>
  <div id="motion-stage" class="preview-stage" aria-label="동작과 효과 재생 무대"><div class="floor-grid" aria-hidden="true"></div><span class="stage-meta">THE READER'S RECORD / MOTION STUDY</span><span id="play-status" class="play-status" role="status">대기</span><div class="reticle" aria-hidden="true"></div><div id="actors"></div><span id="source-label" class="actor-label source"></span><span id="target-label" class="actor-label target"></span></div>
  <div class="transport"><div class="buttons"><button id="play" class="play-primary">▶ 재생</button><button id="stop">정지·복원</button></div><label class="control"><input id="auto-loop" type="checkbox">자동 반복</label><label class="control">속도<input id="speed" type="range" min="0.5" max="1.5" step="0.25" value="1"><output id="speed-label">1×</output></label><label class="control">효과 밀도<select id="quality"><option value="low">낮음</option><option value="balanced" selected>보통</option><option value="high">높음</option></select></label></div>
  <section class="panel"><div class="section-label"><span>동작 선택</span><span id="action-count"></span></div><div id="actions" class="action-grid"></div><div id="walk-controls" class="walk-controls" hidden><label>걷는 방식<select id="walk-mode"><option value="in-place">제자리 걷기</option><option value="travel">앞으로 걷기</option></select></label><label>방향<select id="walk-direction"><option value="1">오른쪽</option><option value="-1">왼쪽</option></select></label><span id="walk-frame-status"></span><a id="walk-sheet-download" download>8프레임 PNG ↓</a></div></section>
  <section class="panel" id="effect-panel"><div class="section-label"><span>효과 선택</span><button id="default-effect">대상의 기본 효과</button></div><div id="effects" class="effects-grid"></div><p class="description" id="effect-description"></p></section>
  <div class="footnote"><label class="motion-toggle"><input id="motion-enabled" type="checkbox" checked>움직임·파티클 켜기</label><span id="coverage"></span></div><p class="description">주요 SD 10개 모습의 걷기는 팔·다리를 그린 8프레임 동작입니다. 다른 동작은 기존 그림의 컷아웃 연출을 사용합니다. 공통 동작 미리보기는 원작의 능력 보유·해금 상태를 뜻하지 않습니다. 임시 외형은 아트 도감의 검토 상태를 따릅니다.</p>
 </section>
</main><script type="module" src="animation/preview.js"></script></html>
